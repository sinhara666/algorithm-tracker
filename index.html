<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlgoTrack - Social Media Algorithm Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0f;color:#e8e8ed;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:24px 20px;border-bottom:1px solid #2a2a4a;position:sticky;top:0;z-index:10}
.header h1{font-size:22px;font-weight:800;letter-spacing:-0.5px}
.header h1 span{background:linear-gradient(90deg,#e63946,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{font-size:13px;color:#8888aa;margin-top:4px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:16px 20px;position:sticky;top:89px;background:#0a0a0f;z-index:9;border-bottom:1px solid #1a1a2e}
.filter-btn{background:#1a1a2e;border:1px solid #2a2a4a;color:#aaaacc;padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .2s}
.filter-btn.active{background:#e63946;border-color:#e63946;color:#fff;font-weight:600}
.timeline{padding:20px;max-width:800px;margin:0 auto}
.update-card{background:#14141f;border:1px solid #2a2a4a;border-radius:12px;padding:18px;margin-bottom:16px;transition:transform .15s}
.update-card:hover{transform:translateY(-2px);border-color:#3a3a5a}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.platform-badge{font-size:11px;font-weight:700;padding:4px 12px;border-radius:12px;text-transform:uppercase;letter-spacing:0.5px}
.platform-instagram{background:#e1306c22;color:#e1306c;border:1px solid #e1306c44}
.platform-tiktok{background:#ffffff15;color:#fff;border:1px solid #ffffff33}
.platform-youtube{background:#ff000022;color:#ff4444;border:1px solid #ff000044}
.platform-x{background:#1d9bf022;color:#1d9bf0;border:1px solid #1d9bf044}
.platform-facebook{background:#1877f222;color:#5b9bd5;border:1px solid #1877f244}
.platform-linkedin{background:#0a66c222;color:#4a9bd5;border:1px solid #0a66c244}
.date{font-size:12px;color:#666688}
.update-card h3{font-size:16px;margin-bottom:8px;line-height:1.4}
.impact{font-size:13px;color:#aaaacc;line-height:1.6;margin-bottom:10px}
.action-box{background:#1a2e1a;border:1px solid #2a5a2a;border-radius:8px;padding:12px;margin-top:10px}
.action-box .label{font-size:11px;font-weight:700;color:#6fbf6f;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.action-box p{font-size:13px;color:#b8d8b8;line-height:1.5}
.severity{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:8px;margin-left:8px}
.severity-high{background:#e6394633;color:#ff6b6b}
.severity-medium{background:#ffa50033;color:#ffb84d}
.severity-low{background:#4caf5033;color:#6fbf6f}
.add-btn{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#e63946,#c1121f);border:none;color:#fff;font-size:28px;cursor:pointer;box-shadow:0 4px 20px #e6394655;z-index:20}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000000cc;z-index:30;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-content{background:#14141f;border:1px solid #2a2a4a;border-radius:16px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-content h2{font-size:18px;margin-bottom:16px}
.modal-content label{display:block;font-size:12px;color:#8888aa;margin:12px 0 4px;font-weight:600}
.modal-content input,.modal-content select,.modal-content textarea{width:100%;background:#0a0a0f;border:1px solid #2a2a4a;border-radius:8px;color:#e8e8ed;padding:10px;font-size:14px;font-family:inherit}
.modal-content textarea{min-height:80px;resize:vertical}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;padding:12px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer}
.btn-primary{background:#e63946;color:#fff}
.btn-secondary{background:#1a1a2e;color:#aaaacc;border:1px solid #2a2a4a}
.delete-btn{background:none;border:none;color:#666688;font-size:12px;cursor:pointer;margin-top:10px;text-decoration:underline}
.empty-state{text-align:center;padding:60px 20px;color:#666688}
.empty-state p{font-size:14px}
.count{font-size:12px;color:#666688;padding:0 20px;margin-top:4px}
</style>
</head>
<body>
<div class="header">
<h1>Algo<span>Track</span></h1>
<p>Every algorithm change, one timeline. Know before your reach dies.</p>
</div>
<div class="filters" id="filters">
<button class="filter-btn active" data-platform="all">All</button>
<button class="filter-btn" data-platform="instagram">Instagram</button>
<button class="filter-btn" data-platform="tiktok">TikTok</button>
<button class="filter-btn" data-platform="youtube">YouTube</button>
<button class="filter-btn" data-platform="x">X</button>
<button class="filter-btn" data-platform="facebook">Facebook</button>
<button class="filter-btn" data-platform="linkedin">LinkedIn</button>
</div>
<div class="count" id="count"></div>
<div class="timeline" id="timeline"></div>
<button class="add-btn" onclick="openModal()">+</button>
<div class="modal" id="modal">
<div class="modal-content">
<h2>Log Algorithm Change</h2>
<label>Platform</label>
<select id="f-platform">
<option value="instagram">Instagram</option>
<option value="tiktok">TikTok</option>
<option value="youtube">YouTube</option>
<option value="x">X (Twitter)</option>
<option value="facebook">Facebook</option>
<option value="linkedin">LinkedIn</option>
</select>
<label>Date</label>
<input type="date" id="f-date">
<label>Title</label>
<input type="text" id="f-title" placeholder="e.g. Reels now favor original audio">
<label>What Changed</label>
<textarea id="f-impact" placeholder="Describe the change and who it affects..."></textarea>
<label>What To Do About It</label>
<textarea id="f-action" placeholder="Actionable advice for creators..."></textarea>
<label>Severity</label>
<select id="f-severity">
<option value="high">High - major reach impact</option>
<option value="medium">Medium - noticeable shift</option>
<option value="low">Low - minor tweak</option>
</select>
<div class="modal-actions">
<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
<button class="btn btn-primary" onclick="saveUpdate()">Save</button>
</div>
</div>
</div>
<script>
const SEED = [
{platform:"instagram",date:"2026-09-24",title:"Mosseri confirms 3 ranking metrics that matter",impact:"Instagram now ranks primarily on watch time, likes per reach, and sends per reach. Follower counts and raw views matter less. DM shares now outweigh likes for non-follower distribution.",action:"Optimize for watch time and DM shares. Make content people want to send to friends, not just like. Track sends per reach in Insights, not just views.",severity:"high"},
{platform:"instagram",date:"2026-06-10",title:"'Your Algorithm' topic controls unified across Feed, Reels, Explore",impact:"Topic preferences set in one surface now apply everywhere. Users who opt out of your topic become harder to reach regardless of engagement strength.",action:"Make your niche obvious through captions, visuals, and audio. If people can't tell what your topic is in 2 seconds, the algorithm can't either.",severity:"high"},
{platform:"instagram",date:"2026-04-30",title:"Original content protections extended to photos and carousels",impact:"Accounts posting mostly unoriginal content are excluded from Explore and recommendations. Simple edits like borders or watermarks don't count as original. 75% of US recommendations now come from original posts.",action:"Stop reposting. Every format needs meaningful original creation now, not just Reels. Check Account Status to see if you're flagged.",severity:"high"},
{platform:"instagram",date:"2026-04-28",title:"Reels favor original audio over trending sounds",impact:"Reels using recycled or watermarked content get down-ranked. Original audio gets a boost. TikTok watermarks continue to suppress reach.",action:"Create original audio or voiceovers. Strip watermarks before cross-posting. Trending sounds still work for established accounts but hurt small ones.",severity:"medium"},
{platform:"tiktok",date:"2026-06-24",title:"Custom search keywords for videos",impact:"Creators can now manually attach custom keywords to videos to improve search visibility, plus a floating Cover Title option. TikTok is doubling down on search as a discovery surface.",action:"Add relevant keywords to every video. Treat TikTok SEO like YouTube SEO now. Cover titles help click-through from search.",severity:"medium"},
{platform:"tiktok",date:"2026-06-15",title:"Video duration extended to 10 minutes for all creators",impact:"Maximum video length raised from 3 to 10 minutes globally, making TikTok competitive with YouTube for longer content.",action:"Test longer storytelling formats. But completion rate still rules, so only go long if you can hold attention.",severity:"medium"},
{platform:"tiktok",date:"2026-01-22",title:"US operations sold, algorithm being retrained",impact:"TikTok US sold to Oracle/Silver Lake consortium for ~$14B. The For You algorithm is being retrained on US-governed data. Reach instability during transition. Completion rate bar reportedly climbing to ~70% watched. AI-generated video now demoted.",action:"Post native, human, niche video. Keep clips tight while completion bar is high. Watch analytics weekly, don't assume last year's playbook works. Avoid AI-generated video as your main format.",severity:"high"},
{platform:"tiktok",date:"2026-01-01",title:"TikTok Shop content gets algorithmic priority",impact:"Native shopping videos get a distribution edge as the platform blends entertainment with commerce.",action:"If you sell anything, make native shopping content. Even affiliate links in Shop-tagged videos get boosted.",severity:"medium"},
{platform:"youtube",date:"2026-05-20",title:"Shorts max duration extended to 3 minutes",impact:"Shorts cap raised from 60 seconds to 3 minutes. Shorts under 60 seconds still qualify for the Shorts feed.",action:"Test 60-90 second Shorts for more depth. But retention math changes, don't pad. 30-45 seconds is still the sweet spot for most niches.",severity:"medium"},
{platform:"youtube",date:"2026-03-01",title:"Shorts and long-form algorithms fully separated",impact:"Browse feed now serves micro-niche clusters. Specialists rewarded over generalists. On Shorts, completion and swipe-away speed decide almost everything. CTR and watch time now judged together, clickbait titles get throttled.",action:"Pick a niche and go deep. Make thumbnails/titles that the content actually delivers on. Use Shorts to funnel into long-form where CPMs are 10-20x higher.",severity:"high"},
{platform:"youtube",date:"2026-01-01",title:"Shorts monetization via Creator Pool",impact:"YouTube keeps ~55% of Shorts ad revenue, splits remaining 45% among creators by share of monetized views. Long-form still pays significantly better.",action:"Use Shorts for discovery, long-form for revenue. Bridge Shorts viewers into full videos.",severity:"medium"},
{platform:"x",date:"2025-11-01",title:"Following feed sorted by Grok-predicted engagement",impact:"The Following feed is now sorted by Grok AI predicted engagement instead of chronological (toggle still available). Grok replaced the legacy recommendation system.",action:"Post when your audience is most active since recency still feeds the prediction. Engagement velocity in the first hour matters more than ever.",severity:"medium"},
{platform:"x",date:"2026-01-30",title:"Video upload limit raised to 4 hours for Premium",impact:"Premium subscribers can now upload videos up to 4 hours long.",action:"Long-form video on X is now viable. Repurpose podcasts and streams.",severity:"low"},
{platform:"facebook",date:"2026-01-01",title:"Reels reach up 40%, still underused",impact:"Facebook Reels distribution increased significantly but most creators aren't posting there.",action:"Cross-post your Reels to Facebook. It's free reach most people are ignoring.",severity:"medium"},
{platform:"linkedin",date:"2026-03-15",title:"Native video gets 3x reach of text posts",impact:"LinkedIn confirmed native video posts receive significantly more distribution than text or link posts.",action:"Post native video on LinkedIn. Under 10 minutes, 16:9, MP4. Huge opportunity for B2B creators.",severity:"high"}
];
let updates = [];
let activeFilter = "all";
async function load() {
  try {
    const res = await fetch("updates.json");
    const auto = await res.json();
    const userEntries = JSON.parse(localStorage.getItem("algotrack_user") || "[]");
    const seen = new Set(auto.map(u => u.platform + "|" + u.date + "|" + u.title));
    const fresh = userEntries.filter(u => !seen.has(u.platform + "|" + u.date + "|" + u.title));
    updates = [...fresh, ...auto];
  } catch(e) {
    const stored = localStorage.getItem("algotrack_updates");
    updates = stored ? JSON.parse(stored) : [...SEED];
  }
  render();
}
function save() {
  const userOnly = updates.filter(u => u.custom);
  localStorage.setItem("algotrack_user", JSON.stringify(userOnly));
  localStorage.setItem("algotrack_updates", JSON.stringify(updates));
}
function render() {
  const tl = document.getElementById("timeline");
  const filtered = activeFilter === "all" ? updates : updates.filter(u => u.platform === activeFilter);
  filtered.sort((a,b) => new Date(b.date) - new Date(a.date));
  document.getElementById("count").textContent = filtered.length + " tracked changes";
  if (!filtered.length) { tl.innerHTML = '<div class="empty-state"><p>No changes tracked for this platform yet.<br>Tap + to log one.</p></div>'; return; }
  tl.innerHTML = filtered.map((u,i) => {
    const idx = updates.indexOf(u);
    const d = new Date(u.date + "T12:00:00");
    const dateStr = d.toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"});
    return `<div class="update-card">
      <div class="card-top">
        <span class="platform-badge platform-${u.platform}">${u.platform}</span>
        <span><span class="date">${dateStr}</span><span class="severity severity-${u.severity}">${u.severity.toUpperCase()}</span></span>
      </div>
      <h3>${esc(u.title)}</h3>
      <div class="impact">${esc(u.impact)}</div>
      <div class="action-box"><div class="label">What to do</div><p>${esc(u.action)}</p></div>
      ${u.custom ? `<button class="delete-btn" onclick="del(${idx})">delete</button>` : ""}
    </div>`;
  }).join("");
}
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function openModal() {
  document.getElementById("f-date").value = new Date().toISOString().split("T")[0];
  document.getElementById("modal").classList.add("open");
}
function closeModal() { document.getElementById("modal").classList.remove("open"); }
function saveUpdate() {
  const u = {
    platform: document.getElementById("f-platform").value,
    date: document.getElementById("f-date").value,
    title: document.getElementById("f-title").value.trim(),
    impact: document.getElementById("f-impact").value.trim(),
    action: document.getElementById("f-action").value.trim(),
    severity: document.getElementById("f-severity").value,
    custom: true
  };
  if (!u.title || !u.impact) { alert("Title and description are required"); return; }
  updates.unshift(u); save(); render(); closeModal();
  document.getElementById("f-title").value = "";
  document.getElementById("f-impact").value = "";
  document.getElementById("f-action").value = "";
}
function del(i) { if (confirm("Delete this entry?")) { updates.splice(i,1); save(); render(); } }
document.getElementById("filters").addEventListener("click", e => {
  if (e.target.classList.contains("filter-btn")) {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    activeFilter = e.target.dataset.platform;
    render();
  }
});
document.getElementById("modal").addEventListener("click", e => {
  if (e.target.id === "modal") closeModal();
});
load();
</script>
</body>
</html>
